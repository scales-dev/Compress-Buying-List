plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'org.example'
version = '1.0'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // https://github.com/xdrop/fuzzywuzzy
    implementation("me.xdrop:fuzzywuzzy:1.4.0")

    implementation 'com.github.scales-dev:Csv-Scripting:-SNAPSHOT'
}

jar {
    manifest {
        // java wont run without this!
        attributes('Main-Class': 'org.example.Main')
    }
}